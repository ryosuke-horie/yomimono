version: 2
updates:
  # npm/pnpm 依存を monorepo 全体でまとめて確認する。
  # 本番ビルド、デプロイ、実行互換性をまとめて確認する更新と、開発補助ツールの更新を分ける。
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/api"
      - "/frontend"
      - "/extension"
    schedule:
      interval: "monthly"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    reviewers:
      - "ryosuke-horie"
    assignees:
      - "ryosuke-horie"
    groups:
      runtime-dependencies:
        applies-to: "version-updates"
        patterns:
          - "@cloudflare/workers-types"
          - "@opennextjs/cloudflare"
          - "wrangler"
          - "workerd"
          - "next"
          - "react"
          - "react-dom"
          - "@tanstack/react-query"
          - "react-icons"
          - "server-only"
          - "hono"
          - "drizzle-orm"
          - "drizzle-kit"
          - "dotenv"
          - "fast-xml-parser"
          - "better-sqlite3"
          - "@types/better-sqlite3"
          - "tailwindcss"
          - "@tailwindcss/postcss"
          - "postcss"
          - "postcss-load-config"
      development-tooling:
        applies-to: "version-updates"
        patterns:
          - "@biomejs/biome"
          - "knip"
          - "typescript"
          - "@types/node"
          - "@types/react"
          - "@types/react-dom"
          - "vitest"
          - "@vitest/*"
          - "happy-dom"
          - "jsdom"
          - "@testing-library/*"
          - "vite"
          - "@vitejs/plugin-react"
          - "tsx"
          - "orval"
          - "openapi3-ts"
          - "yaml"
          - "only-allow"
          - "lefthook"
